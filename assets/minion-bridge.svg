<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="Sketch of a small yellow helper walking across a bridge from VN to JP">
  <title>Bridge SE in training</title>

  <!-- paper card: keeps the sketch legible on both light and dark GitHub themes -->
  <rect x="1" y="1" width="878" height="238" rx="14" fill="#FCFBF7" stroke="#E5E0D4" stroke-width="2"/>

  <!-- faint graph-paper grid -->
  <g stroke="#F0ECE1" stroke-width="1">
    <path d="M40 8V232M80 8V232M120 8V232M160 8V232M200 8V232M240 8V232M280 8V232M320 8V232M360 8V232M400 8V232M440 8V232M480 8V232M520 8V232M560 8V232M600 8V232M640 8V232M680 8V232M720 8V232M760 8V232M800 8V232M840 8V232"/>
    <path d="M8 40H872M8 80H872M8 120H872M8 160H872M8 200H872"/>
  </g>

  <!-- caption -->
  <text x="40" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.2" fill="#A79F8C">BRIDGE SE IN TRAINING</text>

  <!-- direction of travel -->
  <path d="M300 62 C 360 50, 520 50, 580 62" fill="none" stroke="#CFC7B4" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 8"/>
  <path d="M572 55 L582 62 L571 69" fill="none" stroke="#CFC7B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==== bridge ==== -->
  <g stroke="#3B362E" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- abutments -->
    <path d="M60 150 H200 V196 H60 Z" fill="#EDE7D8" stroke-width="2.5"/>
    <path d="M680 150 H820 V196 H680 Z" fill="#EDE7D8" stroke-width="2.5"/>
    <g stroke="#CFC5AE" stroke-width="1.6">
      <path d="M60 166H200M60 182H200M100 150v46M150 150v46"/>
      <path d="M680 166H820M680 182H820M730 150v46M780 150v46"/>
    </g>

    <!-- arch under the deck -->
    <path d="M200 150 Q440 235 680 150" stroke-width="2.5"/>
    <!-- arch supports -->
    <g stroke-width="1.8">
      <path d="M260 150V169M320 150V182M380 150V190M440 150V192M500 150V190M560 150V182M620 150V169"/>
    </g>

    <!-- deck -->
    <path d="M52 150 H828" stroke-width="3.4"/>
    <path d="M52 156 H828" stroke-width="1.4" stroke-dasharray="10 9"/>

    <!-- railing posts, left and right of the walker -->
    <g stroke-width="2">
      <path d="M232 150v-22M284 150v-22M336 150v-22M544 150v-22M596 150v-22M648 150v-22"/>
      <path d="M226 128H342M538 128H654"/>
    </g>
  </g>

  <!-- end labels -->
  <text x="130" y="224" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#9A907C">VN</text>
  <text x="750" y="224" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#9A907C">JP</text>

  <!-- ==== the little yellow helper ==== -->
  <g stroke="#33302A" stroke-linecap="round" stroke-linejoin="round">

    <!-- shadow on the deck -->
    <ellipse cx="440" cy="151" rx="30" ry="4" fill="#E2DCCB" stroke="none"/>

    <!-- legs -->
    <path d="M428 128v13M452 128v13" fill="none" stroke-width="6"/>
    <path d="M420 148 q8 -9 16 -1" fill="#33302A" stroke-width="2.5"/>
    <path d="M444 148 q8 -9 16 -1" fill="#33302A" stroke-width="2.5"/>

    <!-- body capsule -->
    <rect x="408" y="48" width="64" height="86" rx="32" fill="#F5D13F" stroke-width="2.6"/>
    <!-- soft shading down the right edge -->
    <path d="M462 62 q10 28 0 58" fill="none" stroke="#E3BB2C" stroke-width="5" opacity=".65"/>

    <!-- overalls -->
    <path d="M410 104 q30 12 60 0 v18 q-30 12 -60 0 z" fill="#3D6DA6" stroke-width="2.4"/>
    <path d="M418 106 l6 -18" fill="none" stroke-width="2.4"/>
    <path d="M462 106 l-6 -18" fill="none" stroke-width="2.4"/>
    <rect x="428" y="108" width="24" height="14" rx="3" fill="#33609A" stroke-width="1.8"/>

    <!-- goggle strap -->
    <path d="M409 76 H471" fill="none" stroke="#5A5A5A" stroke-width="7"/>
    <!-- goggle -->
    <circle cx="440" cy="76" r="18" fill="#DCDCDC" stroke="#5A5A5A" stroke-width="4"/>
    <circle cx="440" cy="76" r="12.5" fill="#FFFFFF" stroke-width="1.8"/>
    <circle cx="441" cy="76" r="6.5" fill="#7A5230" stroke-width="1.4"/>
    <circle cx="441" cy="76" r="3" fill="#221E19" stroke="none"/>
    <circle cx="437.5" cy="72.5" r="1.9" fill="#FFFFFF" stroke="none"/>

    <!-- smile -->
    <path d="M429 98 q11 9 22 0" fill="none" stroke-width="2.4"/>

    <!-- arms -->
    <path d="M409 88 q-14 6 -16 18" fill="none" stroke-width="5"/>
    <path d="M471 88 q14 6 16 18" fill="none" stroke-width="5"/>
    <circle cx="392" cy="109" r="5" fill="#F5D13F" stroke-width="2.2"/>
    <circle cx="488" cy="109" r="5" fill="#F5D13F" stroke-width="2.2"/>

    <!-- little satchel in the right hand -->
    <rect x="480" y="114" width="22" height="16" rx="3" fill="#B07A45" stroke-width="2.2"/>
    <path d="M486 114 v-4 q5 -4 10 0 v4" fill="none" stroke-width="2"/>

    <!-- hair sprigs -->
    <path d="M432 48 q-4 -10 2 -14" fill="none" stroke-width="2.2"/>
    <path d="M441 46 q0 -12 5 -15" fill="none" stroke-width="2.2"/>
    <path d="M450 49 q6 -8 4 -14" fill="none" stroke-width="2.2"/>
  </g>
</svg>
